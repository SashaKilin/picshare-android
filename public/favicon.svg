<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="85%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Glass Glow -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Photo 1 Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Sunset Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="mountBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="mountFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowBg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312E81" flood-opacity="0.45"/>
    </filter>
    <filter id="shadowCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
    <filter id="glowSparkle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" filter="url(#shadowBg)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="25" y="25" width="462" height="462" rx="115" fill="none" stroke="url(#glassGrad)" stroke-width="4"/>

  <!-- Back Photo Card (Tilted Left) -->
  <g transform="translate(230, 260) rotate(-14) translate(-230, -260)" filter="url(#shadowCard)">
    <rect x="120" y="145" width="220" height="235" rx="26" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
    <circle cx="270" cy="195" r="22" fill="rgba(255,255,255,0.4)"/>
    <path d="M140 330 L200 250 L240 290 L290 230 L320 330 Z" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- Front Photo Card (Tilted Right) -->
  <g transform="translate(270, 275) rotate(7) translate(-270, -275)" filter="url(#shadowCard)">
    <!-- White Card Border/Body -->
    <rect x="160" y="155" width="226" height="248" rx="28" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Photo Inner Area -->
    <rect x="178" y="173" width="190" height="175" rx="18" fill="url(#skyGrad)"/>

    <!-- Sun -->
    <circle cx="316" cy="225" r="22" fill="#FEF08A"/>
    <circle cx="316" cy="225" r="16" fill="#FDE047"/>

    <!-- Mountain Back -->
    <path d="M230 348 L285 270 L345 348 Z" fill="url(#mountBack)"/>

    <!-- Mountain Front -->
    <path d="M178 348 L235 285 L285 348 Z" fill="url(#mountFront)"/>

    <!-- Polaroid Bottom Heart / Dot Accent -->
    <circle cx="273" cy="378" r="6" fill="#A855F7" opacity="0.8"/>
  </g>

  <!-- Floating Sparkle Stars -->
  <!-- Top Right Big Star -->
  <g filter="url(#glowSparkle)" transform="translate(390, 115)">
    <path d="M0 -34 Q0 0 34 0 Q0 0 0 34 Q0 0 -34 0 Q0 0 0 -34 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="6" fill="#FEF08A"/>
  </g>

  <!-- Bottom Left Small Star -->
  <g filter="url(#glowSparkle)" transform="translate(95, 360)">
    <path d="M0 -18 Q0 0 18 0 Q0 0 0 18 Q0 0 -18 0 Q0 0 0 -18 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Top Left Tiny Sparkle -->
  <circle cx="120" cy="130" r="5" fill="#FFFFFF" opacity="0.85"/>
</svg>
